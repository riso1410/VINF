services:
  wiki-mapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wiki-mapper
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./src:/app/src
    environment:
      - PYSPARK_PYTHON=/usr/local/bin/python
      - PYSPARK_DRIVER_PYTHON=/usr/local/bin/python
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    mem_limit: 8g
    cpus: "8"
    command: ["./scripts/run_spark_pipeline.sh"]
  lucene-search:
    build:
      context: .
      dockerfile: Dockerfile.lucene
    container_name: lucene-search
    stdin_open: true
    tty: true
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./lucene-index:/app/index
    environment:
      - DATA_FILE=/app/data/wiki_recipes.jsonl
      - INDEX_DIR=/app/index
      - PYTHONUNBUFFERED=1
